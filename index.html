<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Search</title>
<style>
  :root{--purple:#6b21a8;--deep:#4c1d95;--soft:#a855f7;--bg:#faf5ff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--purple)}
  .bar{background:linear-gradient(90deg,var(--deep),var(--soft));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
  .bar h1{margin:0;font-size:18px;letter-spacing:.5px}
  .bar small{opacity:.9;font-size:12px}
  .note{background:#f3e8ff;color:var(--deep);font-size:13px;padding:8px 18px;border-bottom:1px solid #e9d5ff}
  .frameWrap{position:absolute;top:0;left:0;right:0;bottom:0;top:86px}
  iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
  <div class="bar">
    <h1>Dog Search</h1>
    <small>national dog registry · via dogs.akeyo.io</small>
  </div>
  <div class="note">Complete the one-time human-verification inside the panel below, then search by chip number.</div>
  <div class="frameWrap">
    <iframe src="https://dogsearch.moag.gov.il/#/pages/pets"
            referrerpolicy="no-referrer-when-downgrade"
            allow="clipboard-write"></iframe>
  </div>
</body>
</html>
